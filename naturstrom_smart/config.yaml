name: "naturstrom smart Vorschau"
version: "0.1.0"
slug: "naturstrom_smart"
description: "Bewertet täglich vorausschauend, ob naturstrom smart am Folgetag günstiger ist als der Fixtarif, und prüft, ob der Batteriespeicher die Verschiebung tragen kann."
url: "https://github.com/mattmeye/dyn-energy-price"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:transmission-tower"
panel_title: "naturstrom smart"
panel_admin: true
homeassistant_api: true
hassio_api: true
services:
  - "mqtt:want"
options:
  log_level: "info"
  run_hour: 13
  run_minute: 30
  timezone: "Europe/Berlin"
  price_source: "energy-charts"
schema:
  log_level: "list(debug|info|warning|error)"
  run_hour: "int(0,23)"
  run_minute: "int(0,59)"
  timezone: "str"
  price_source: "list(energy-charts)"
